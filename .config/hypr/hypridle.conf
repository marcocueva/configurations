# -----------------------------------------
# Hypridle: Smart Idle System
# dim → lock → dpms → suspend
# with wallpaper-aware dimming,
# media-aware blocking,
# and smart suspend conditions
# -----------------------------------------

# - # 1. Wallpaper-aware dimming
# - listener {
# -     timeout = 120
# -     on-timeout = ~/.config/hypr/scripts/dim.sh
# -     on-resume = ~/.config/hypr/scripts/undim.sh
# - }

# 2. Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = hyprlock
}

# 3. DPMS off after 7 minutes
listener {
    timeout = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# - # 4. Suspend after 15 minutes (smart)
# - listener {
# -     timeout = 900
# -     on-timeout = systemctl suspend
# - }
# - 

# - # 1. Wallpaper-aware dimming
listener {
    timeout = 120
    on-timeout = ~/.config/hypr/scripts/media-active.sh && ~/.config/hypr/scripts/dim.sh
    on-resume = ~/.config/hypr/scripts/undim.sh
}

# - # 4. Suspend after 15 minutes (smart)
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/suspend-ok.sh && systemctl suspend
}

