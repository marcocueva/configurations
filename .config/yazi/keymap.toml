[[mgr.prepend_keymap]]
on   = [ "." ]
run = "hidden toggle"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on   = "+"
run  = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "Zoom out hovered file"

[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin jump-to-char"
desc = "Jump to char"

[[mgr.prepend_keymap]]
on   = [ "g", "u" ]
run  = 'cd /run/media/marco'
desc = "Go to USB drives"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Pictures"
desc = "Cd to ~/Pictures"

[[mgr.prepend_keymap]]
on  = "K"
run = "plugin parent-arrow -1"

[[mgr.prepend_keymap]]
on  = "J"
run = "plugin parent-arrow 1"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# Toggle Play/Pause for the background MPV
[[mgr.prepend_keymap]]
on   = [ "m", "p" ]
run  = 'shell -- echo "cycle pause" | socat - UNIX-CONNECT:/tmp/mpv-socket'
desc = "MPV: Toggle Play/Pause"

# Kill the background MPV (Panic Button)
[[mgr.prepend_keymap]]
on   = [ "m", "k" ]
run  = 'shell -- pkill -f mpv-socket'
desc = "MPV: Stop/Kill process"

# Stop and Kill (The "I'm done" button)
[[mgr.prepend_keymap]]
on   = [ "m", "q" ]
run  = 'shell -- echo "quit" | socat - UNIX-CONNECT:/tmp/mpv-socket'
desc = "MPV: Stop Music"

# Show what is playing via a system notification
[[mgr.prepend_keymap]]
on   = [ "m", "i" ]
run  = 'shell -- echo "{ \"command\": [\"get_property\", \"media-title\"] }" | socat - /tmp/yazi-mpv-socket | notify-send "Now Playing"'
desc = "MPV: Show song info"

[[mgr.prepend_keymap]]
on   = [ "m", "s" ]
run  = 'shell --block -- pw-top'
desc = "Show active audio streams (PipeWire)"

[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Open Device/Mount menu"

[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

[[mgr.prepend_keymap]]
on = ["R","b"]
run = "plugin recycle-bin"
desc = "Open Recycle Bin menu"


[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

[[mgr.prepend_keymap]]
on = [ "u", "a" ]
run = "plugin yamb -- save"
desc = "Add bookmark"

[[mgr.prepend_keymap]]
on = [ "u", "g" ]
run = "plugin yamb -- jump_by_key"
desc = "Jump bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "G" ]
run = "plugin yamb -- jump_by_fzf"
desc = "Jump bookmark by fzf"

[[mgr.prepend_keymap]]
on = [ "u", "d" ]
run = "plugin yamb -- delete_by_key"
desc = "Delete bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "D" ]
run = "plugin yamb -- delete_by_fzf"
desc = "Delete bookmark by fzf"

[[mgr.prepend_keymap]]
on = [ "u", "A" ]
run = "plugin yamb -- delete_all"
desc = "Delete all bookmarks"

[[mgr.prepend_keymap]]
on = [ "u", "r" ]
run = "plugin yamb -- rename_by_key"
desc = "Rename bookmark by key"

[[mgr.prepend_keymap]]
on = [ "u", "R" ]
run = "plugin yamb -- rename_by_fzf"
desc = "Rename bookmark by fzf"

[[mgr.prepend_keymap]]
on  = "y"
run = [ 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank" ]

[[mgr.prepend_keymap]]
on   = [ "c", "p" ]
run  = "plugin pandoc"
desc = "Pandoc: Interactive Convert"

# Send selected file via email with neomutt
[[mgr.prepend_keymap]]
on  = "<C-m>"
#run = "shell --block -- neomutt -a %s -e 'set from=\"mail@marcocueva.com\"'"
run = '''shell --
	paths=$(for p in %s; do echo "$p"; done | paste -s -d,)
	thunderbird -compose "attachment='$paths'"
'''
