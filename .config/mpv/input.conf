x quit
## Volume (Fixed the 'add volume 2' mistake for down)
VOLUME_UP    add volume 2
VOLUME_DOWN  add volume -2

# Seeking
FORWARD        seek  10
REWIND         seek -10
HOME           seek 0 absolute
END            seek 95 absolute-percent

# Media Keys (Explicit override to prevent quit)
STOP           ignore
STOP           stop

# Fallback bindings if you want keyboard shortcuts for play/pause/skip
SPACE          cycle pause
p              cycle pause
>              playlist-next
<              playlist-prev

# Alternative fallback XF86_ bindings (lowercase sub-names)
 XF86_STOP       stop
 XF86_NEXT       playlist-next
 XF86_PREV       playlist-prev
 PLAY cycle pause                       # toggle pause/playback mode
 PAUSE cycle pause                      # toggle pause/playback mode
 PLAYPAUSE cycle pause                  # toggle pause/playback mode

# Scripts (Ensure these names match your .lua filenames exactly)
CTRL+f          script-binding select/selectformat/menu
CTRL+p          script-binding select/select-playlist

SHIFT+ENTER     script-binding playlistmanager/showplaylist
CTRL+ENTER      script-binding playlistmanager/openmenu

# Fine-grained seeking for language practice
RIGHT seek  2
LEFT  seek -2
# Navigation
NEXT          playlist-next
PREV          playlist-prev

#quality-menu A user script for MPV that allows you to change the streamed video and audio quality (ytdl-format) on the fly.
F     script-binding quality_menu/video_formats_toggle
Alt+f script-binding quality_menu/audio_formats_toggle
Ctrl+r script-binding quality_menu/reload
