osc=no
# Don't allow new windows to be larger than the screen.
autofit-larger=100%x100%
profile=gpu-hq
volume=30

# add a file to your playlist
input-ipc-server=/tmp/mpvsocket

# Enable hardware decoding if available, =yes is implied.
hwdec
# Spaces don't have to be escaped.
osd-playing-msg=File: ${filename}

# Screenshot:
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=3 # Setting too high may lag the PC.

# Using the tilde (usually works)
screenshot-directory="~/mpv/Pics/"

# To remove the [modernz] sub_margins warning from your terminal output:
# watch-later-options-remove=sub-pos

