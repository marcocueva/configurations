# ======================================================================
#  Marco's Modern tmux.conf (Fedora 43 + Hyprland + Neovim)
# ======================================================================

##### XDG & PLUGIN PATHS ################################################
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

##### TERMINAL & COLORS #################################################
# Modern terminal support for TrueColor and undercurls
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

##### ENVIRONMENT (Wayland/Hyprland) ###################################
# This ensures tmux picks up your Wayland session variables correctly
set -g update-environment "DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_SESSION_TYPE"

##### SHELL #############################################################
set -g default-shell /bin/zsh

##### MOUSE & INTERACTION ###############################################
set -g mouse on
set -g focus-events on
set -s escape-time 0 # Essential for Neovim responsiveness

##### PREFIX ############################################################
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### RELOAD ############################################################
# Using the absolute path to avoid ambiguity
bind s source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

##### NAVIGATION ########################################################
# Vim-style pane movement (Manual fallbacks for the plugin)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + arrows (No prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + arrows (Switch windows)
bind -n S-Left previous-window
bind -n S-Right next-window

##### WINDOW/PANE BEHAVIOR #############################################
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Inherit CWD
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### PANE RESIZING ####################################################
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### COPY MODE (VI + WAYLAND) #########################################
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Wayland native copy (requires 'wl-clipboard' package)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

##### GRUVBOX STATUSLINE (NO PLUGIN) ###################################
set -g status on
set -g status-interval 2
set -g status-justify centre
set -g status-style "bg=colour237,fg=colour223"

# Left side: Session Name
set -g status-left-length 30
set -g status-left "#[fg=colour232,bg=colour214,bold] #S #[fg=colour214,bg=colour237,nobold]"

# Right side: Date/Time
set -g status-right-length 150
set -g status-right "#[fg=colour239,bg=colour237]#[fg=colour223,bg=colour239] %a %Y-%m-%d %H:%M "

# Window tabs
setw -g window-status-format " #[fg=colour245]#I:#W "
setw -g window-status-current-format "#[fg=colour237,bg=colour214,bold] #I:#W #[fg=colour214,bg=colour237,nobold]"

# Borders & Messages
set -g pane-active-border-style fg=colour214
set -g pane-border-style fg=colour239
set -g message-style fg=colour232,bg=colour214,bold

## YAZI ##
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

##### PLUGINS ###########################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Continuum/Resurrect settings
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

##### TPM INIT (KEEP AT BOTTOM) ########################################
# Check if TPM is installed, if not, clone it
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
